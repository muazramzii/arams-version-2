name: CI

# Every push and every pull request. The 90 backend tests are the only thing
# that has ever caught a regression in this project; until now they ran only
# when someone remembered to run them.
on:
  push:
  pull_request:

# Least privilege by default: every job here only needs to read the code. A job
# that needs more (none does today) must ask for it explicitly.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # MariaDB 10.4 to match the UTHM server. The version matters: the schema
    # relies on strict mode, and 10.4 lacks RENAME INDEX, which shaped how the
    # KPI target migrations were written.
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: arams2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, fileinfo, intl, zip
          coverage: none

      # setup-php has no built-in dependency cache (unlike setup-node's
      # `cache: npm` below), so Composer's cache directory is resolved and
      # cached explicitly.
      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment file
        run: cp .env.example .env

      - name: Generate the application key
        run: php artisan key:generate

      # phpunit.xml pins DB_CONNECTION=mysql and DB_DATABASE=arams2_test, and
      # leaves host, user and password to the framework defaults — 127.0.0.1,
      # root, empty — which is what the service container above provides.
      # Test classes carry RefreshDatabase and $seed, so migrations and seeders
      # run themselves.
      - name: Run the Laravel test suite
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # oxlint. Laravel Pint (backend style) is intentionally not gated yet —
      # see issue #4 — because it fails on pre-existing files unrelated to
      # any single change.
      - name: Lint the frontend
        run: npm run lint

      # Vitest + React Testing Library. First coverage: role-based navigation.
      - name: Test the frontend
        run: npm test

      # `npm run build` is `tsc -b && vite build`. Building is a stricter gate
      # than type-checking alone: erasableSyntaxOnly has already rejected code
      # here that `tsc --noEmit` accepted.
      - name: Build the frontend
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    # Only what the scan needs: read the code, read the PR's commit list.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history so a push is scanned commit by commit.
          fetch-depth: 0

      # On pull_request events gitleaks-action refuses to run without a
      # GITHUB_TOKEN (it lists the PR's commits through the API), so this job
      # failed on every PR while still passing on push. The token is the
      # automatic per-run one, scoped by the permissions block above.
      #
      # Comments and artifact upload are switched off on purpose: this is a
      # public repository, and an uploaded findings report would be readable
      # by anyone. If a real secret is ever detected, the log names the file
      # and line (the action redacts the value) and nothing else is published.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      # gitleaks looks for credential-shaped strings; a plain data dump has
      # none. database/arams_uthm_schema.sql is the one file .gitignore
      # deliberately negates — everything else matching *.sql, including
      # arams_uthm.sql itself, must never be tracked.
      - name: Guard against a committed data dump
        run: |
          offenders=$(git ls-files -- '*.sql' | grep -v '^database/arams_uthm_schema.sql$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Tracked .sql file(s) other than the schema-only file are not allowed:"
            echo "$offenders"
            exit 1
          fi

  migrations:
    name: Migration reversibility
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: arams2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    # migrate/rollback/migrate:fresh read the DB_* environment directly —
    # unlike php artisan test, there is no phpunit.xml <env> block for a
    # plain artisan command, so these are set explicitly here.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: arams2_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      FINGERPRINT_PHP: |
        $d=DB::getDatabaseName(); $t=Schema::getTableListing($d, false); sort($t); $s=[]; foreach ($t as $n) { foreach (Schema::getColumns($n) as $c) { $s[]=$n.".".$c["name"].":".$c["type"]; } } sort($s); echo count($t)." tables ".count($s)." columns ".md5(implode("\n",$s));

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, fileinfo, intl, zip
          coverage: none

      # Same cache as the backend job; see the comment there.
      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment file
        run: cp .env.example .env

      - name: Generate the application key
        run: php artisan key:generate

      # Exit codes alone prove little: a down() that does nothing still exits 0.
      # So each phase also inspects the database. The fingerprint covers every
      # table.column:type in the current database, scoped on purpose because
      # Schema::getTableListing() otherwise lists every database on the server.
      - name: Migrate from empty
        run: php artisan migrate:fresh --force

      - name: Verify the schema that was built
        run: |
          for table in users faculties research_records submissions submission_reviews kpi_targets audit_events; do
            php artisan tinker --execute="echo Schema::hasTable('$table') ? 'yes' : 'no';" | tr -d '\r' | grep -qx yes \
              || { echo "::error::Expected table '$table' is missing after migrate:fresh"; exit 1; }
          done
          php artisan tinker --execute="$FINGERPRINT_PHP" | tr -d '\r' | tee "$RUNNER_TEMP/schema-first.txt"

      - name: Roll back every migration
        run: php artisan migrate:rollback --force

      - name: Verify the rollback left nothing behind
        run: |
          remaining=$(php artisan tinker --execute='echo implode(",", Schema::getTableListing(DB::getDatabaseName(), false));' | tr -d '\r')
          echo "tables remaining after rollback: $remaining"
          if [ "$remaining" != "migrations" ]; then
            echo "::error::Rollback left tables behind (only 'migrations' should remain): $remaining"
            exit 1
          fi

      - name: Migrate again
        run: php artisan migrate:fresh --force

      - name: Verify the rebuilt schema matches the first build
        run: |
          first=$(cat "$RUNNER_TEMP/schema-first.txt")
          second=$(php artisan tinker --execute="$FINGERPRINT_PHP" | tr -d '\r')
          echo "first : $first"
          echo "second: $second"
          if [ -z "$first" ] || [ "$first" != "$second" ]; then
            echo "::error::Schema after rollback and re-migration differs from the first build"
            exit 1
          fi
